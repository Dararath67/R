<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" width="100%" height="100%" fill="none">
  <!-- Transparent Background -->

  <!-- TERK Text -->
  <text x="15" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#0F172A" letter-spacing="-1.5">TERK</text>

  <!-- TLA Amber Badge Background -->
  <rect x="200" y="28" width="165" height="68" rx="18" fill="#ECA52B"/>

  <!-- TLA Text Inside Badge -->
  <text x="220" y="82" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="58" fill="#020617" letter-spacing="-1">TLA</text>

  <!-- Chain Link Icon above TERK & TLA boundary -->
  <g transform="translate(160, 22) rotate(-35 24 24)">
    <!-- Left Loop (White/Dark Outline) -->
    <rect x="2" y="14" width="28" height="16" rx="8" stroke="#0F172A" stroke-width="5" fill="none"/>
    <!-- Right Loop Interlocking -->
    <rect x="18" y="14" width="28" height="16" rx="8" stroke="#475569" stroke-width="5" fill="none"/>
  </g>
</svg>
